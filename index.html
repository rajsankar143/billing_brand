<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jewellery Billing</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
  <!-- JsBarcode for barcode generation -->
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
  <style>
    body { padding: 20px; }
    .table th, .table td { vertical-align: middle; text-align: center; }
    .total-row td { font-weight: bold; }
    #customerInfo { display: none; }
    #barcode { margin-top: 20px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="text-center mb-4 p-3 bg-primary text-white rounded">
      <h1 class="mb-0">Sahu Jewellery</h1>
      <p class="mb-0">Nilagiri, Balasore</p>
      <h2 class="mt-2">Jewellery Billing System</h2>
    </div>

    <!-- Customer Info Inputs -->
    <div class="row g-3 mb-4">
      <div class="col-md-3">
        <input type="text" id="customerName" class="form-control" placeholder="Customer Name">
      </div>
      <div class="col-md-3">
        <input type="text" id="customerAddress" class="form-control" placeholder="Customer Address">
      </div>
      <div class="col-md-3">
        <input type="tel" id="customerMobile" class="form-control" placeholder="Customer Mobile">
      </div>
      <div class="col-md-3">
        <input type="text" id="customerGSTN" class="form-control" placeholder="Customer GSTN Number">
      </div>
    </div>

    <div class="text-end mb-4">
      <button id="submitCustomer" class="btn btn-success">Submit Customer Info</button>
    </div>

    <!-- Displayed Customer Info -->
    <div id="customerInfo" class="mb-4 p-3 border rounded bg-light">
      <h5>Customer Details</h5>
      <p><strong>Name:</strong> <span id="displayCustomerName"></span></p>
      <p><strong>Address:</strong> <span id="displayCustomerAddress"></span></p>
      <p><strong>Mobile:</strong> <span id="displayCustomerMobile"></span></p>
      <p><strong>GSTN:</strong> <span id="displayCustomerGSTN"></span></p>
      <p><strong>Invoice No:</strong> <span id="invoiceNumber"></span></p>
    </div>

    <!-- Item Entry -->
    <div class="row g-3 mb-4">
      <div class="col-md-3">
        <input list="itemList" type="text" id="itemName" class="form-control" placeholder="Item Name">
        <datalist id="itemList">
          <option value="Gold Ring">
          <option value="Gold Necklace">
          <option value="Gold Bracelet">
          <option value="Gold Earrings">
          <option value="Gold Chain">
        </datalist>
      </div>
      <div class="col-md-2">
        <input type="number" id="itemWeight" class="form-control" placeholder="Weight (gms)">
      </div>
      <div class="col-md-2">
        <input type="number" id="itemRate" class="form-control" placeholder="Rate (/gm)">
      </div>
      <div class="col-md-2">
        <input type="number" id="itemMaking" class="form-control" placeholder="Making Charges" value="850">
      </div>
      <div class="col-md-3">
        <button id="addItem" class="btn btn-primary w-100">Add Item</button>
      </div>
    </div>

    <table class="table table-bordered table-striped">
      <thead class="table-dark">
        <tr>
          <th>Item</th>
          <th>Weight (gms)</th>
          <th>Rate (/gm)</th>
          <th>Making Charges</th>
          <th>Price</th>
        </tr>
      </thead>
      <tbody id="billTable"></tbody>
      <tfoot>
        <tr class="total-row">
          <td colspan="4">Subtotal</td>
          <td id="subtotal">0.00</td>
        </tr>
        <tr class="total-row">
          <td colspan="4">GST (3%)</td>
          <td id="gstAmount">0.00</td>
        </tr>
        <tr class="total-row">
          <td colspan="4">Total (incl. GST)</td>
          <td id="totalAmount">0.00</td>
        </tr>
      </tfoot>
    </table>

    <!-- Export Buttons at Bottom -->
    <div class="text-end mt-4">
      <button id="exportCSV" class="btn btn-secondary me-2">Export CSV</button>
      <button id="exportPDF" class="btn btn-secondary">Export PDF</button>
    </div>

    <!-- Barcode -->
    <div class="text-center">
      <svg id="barcode"></svg>
    </div>
  </div>

  <script>
    $(document).ready(function() {
      let subtotal = 0;
      const invoiceNumber = 'INV' + Date.now();

      $('#invoiceNumber').text(invoiceNumber);
      JsBarcode("#barcode", invoiceNumber, { format: "CODE128", width: 2, height: 50 });

      // Customer info submission
      $('#submitCustomer').click(function() {
        const name = $('#customerName').val().trim();
        const address = $('#customerAddress').val().trim();
        const mobile = $('#customerMobile').val().trim();
        const gstn = $('#customerGSTN').val().trim();

        if (name && address && mobile && gstn) {
          $('#displayCustomerName').text(name);
          $('#displayCustomerAddress').text(address);
          $('#displayCustomerMobile').text(mobile);
          $('#displayCustomerGSTN').text(gstn);
          $('#customerInfo').slideDown();
        } else {
          alert('Please enter name, address, mobile number, and GSTN.');
        }
      });

      // Add item to bill
      $('#addItem').click(function() {
        const name = $('#itemName').val();
        const weight = parseFloat($('#itemWeight').val());
        const rate = parseFloat($('#itemRate').val());
        const making = parseFloat($('#itemMaking').val());

        if (name && weight && rate && making >= 0) {
          const price = weight * rate + making;
          subtotal += price;
          const gst = subtotal * 0.03;
          const totalWithGST = subtotal + gst;

          const newRow = `<tr>
            <td>${name}</td>
            <td>${weight.toFixed(2)}</td>
            <td>${rate.toFixed(2)}</td>
            <td>${making.toFixed(2)}</td>
            <td>${price.toFixed(2)}</td>
          </tr>`;

          $('#billTable').append(newRow);
          $('#subtotal').text(subtotal.toFixed(2));
          $('#gstAmount').text(gst.toFixed(2));
          $('#totalAmount').text(totalWithGST.toFixed(2));

          $('#itemName').val('');
          $('#itemWeight').val('');
          $('#itemRate').val('');
          $('#itemMaking').val('');
        } else {
          alert('Please fill out all fields including making charges');
        }
      });

      // Export CSV and PDF functions remain unchanged
      $('#exportCSV').click(function() {
        let csvContent = `Shop Name,Sahu Jewellery\n` +
          `Shop Address,Nilagiri, Balasore\n` +
          `Invoice No,${invoiceNumber}\n` +
          `Customer Name,${$('#customerName').val().trim()}\n` +
          `Customer Address,${$('#customerAddress').val().trim()}\n` +
          `Customer Mobile,${$('#customerMobile').val().trim()}\n` +
          `Customer GSTN,${$('#customerGSTN').val().trim()}\n` +
          `Item,Weight (gms),Rate (/gm),Making Charges,Price\n`;
        $('#billTable tr').each(function() {
          const row = $(this).find('td').map(function() { return $(this).text(); }).get().join(',');
          csvContent += row + '\n';
        });
        csvContent += `Subtotal, , , ,${$('#subtotal').text()}\n`;
        csvContent += `GST (3%), , , ,${$('#gstAmount').text()}\n`;
        csvContent += `Total (incl. GST), , , ,${$('#totalAmount').text()}`;

        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = 'bill.csv';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      });

      $('#exportPDF').click(function() {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        doc.setFontSize(14);
        doc.text('Sahu Jewellery', 14, 20);
        doc.setFontSize(12);
        doc.text('Nilagiri, Balasore', 14, 26);
        doc.setFontSize(14);
        doc.text('Jewellery Billing Invoice', 14, 36);
        doc.setFontSize(12);
        doc.text(`Invoice No: ${invoiceNumber}`, 14, 46);
        doc.text(`Customer Name: ${$('#customerName').val().trim()}`, 14, 52);
        doc.text(`Customer Address: ${$('#customerAddress').val().trim()}`, 14, 58);
        doc.text(`Customer Mobile: ${$('#customerMobile').val().trim()}`, 14, 64);
        doc.text(`Customer GSTN: ${$('#customerGSTN').val().trim()}`, 14, 70);

        const rows = [];
        $('#billTable tr').each(function() {
          const cols = $(this).find('td').map(function() { return $(this).text(); }).get();
          rows.push(cols);
        });
        doc.autoTable({ head: [['Item','Weight (gms)','Rate (/gm)','Making Charges','Price']], body: rows, startY: 76 });
        const finalY = doc.lastAutoTable.finalY || 76;
        doc.text(`Subtotal: ${$('#subtotal').text()}`, 14, finalY + 10);
        doc.text(`GST (3%): ${$('#gstAmount').text()}`, 14, finalY + 16);
        doc.text(`Total (incl. GST): ${$('#totalAmount').text()}`, 14, finalY + 22);
        doc.save('bill.pdf');
      });
    });
  </script>
</body>
</html>
